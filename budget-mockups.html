<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Budget — screen mockups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --page:#E8EAF0; --surface:#FFFFFF; --raised:#F5F6FA;
  --ink:#14161F; --sub:#6A7080; --faint:#9AA0AE; --line:#E4E7EE;
  --brand:#2F3BA2; --brand-soft:#EAECF8; --brand-ink:#1F2875;
  --ok:#1B7A4D; --ok-soft:#E4F3EB;
  --warn:#9A6516; --warn-soft:#FBF0DC;
  --bad:#A9271F; --bad-soft:#FBE7E5;
  --shadow:0 24px 60px rgba(18,22,40,.22);
  --r:14px;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--page); color:var(--ink);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
body{
  background:var(--page); color:var(--ink);
  font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:0; overflow:hidden;
}
/* the phone is built at native iPhone 17 pixels: 1206 x 2622 screen.
   the UI is laid out in 402 x 874 points and scaled x3, so text stays vector-sharp. */
.fit{transform:scale(var(--k,.32));transform-origin:center center}
.phone{
  width:1278px;height:2694px;padding:36px;border-radius:198px;position:relative;
  background:linear-gradient(150deg,#3A3E4B,#101218 45%,#4A4F5E);
  box-shadow:0 60px 160px rgba(16,20,38,.35);
}
.screen{
  width:1206px;height:2622px;background:var(--surface);
  border-radius:165px;overflow:hidden;position:relative;
}
.device{
  width:402px;height:874px;transform:scale(3);transform-origin:top left;
  display:flex;flex-direction:column;position:relative;background:var(--surface);
}
/* Dynamic Island */
.island{
  position:absolute; top:11px; left:50%; transform:translateX(-50%);
  width:124px; height:36px; background:#000; border-radius:20px; z-index:30;
}
/* status bar */
.status{
  flex:0 0 auto; height:54px; display:flex; align-items:flex-end; justify-content:space-between;
  padding:0 30px 7px; font-size:15px; font-weight:700; letter-spacing:.01em; color:var(--ink);
  background:var(--surface);
}
.status .right{display:flex;align-items:flex-end;gap:5px}
.bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.bars i{width:3px;background:var(--ink);border-radius:1px}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
.bars i:nth-child(3){height:9px}.bars i:nth-child(4){height:11px}
.wifi{font-size:13px;line-height:1}
.batt{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:4px;position:relative;opacity:.9}
.batt::after{content:"";position:absolute;right:-3px;top:3.5px;width:2px;height:5px;background:var(--ink);border-radius:0 2px 2px 0}
.batt i{position:absolute;inset:2px;width:70%;background:var(--ink);border-radius:2px;display:block}
/* home indicator */
.homebar{
  position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
  width:140px;height:5px;border-radius:3px;background:var(--ink);opacity:.3;z-index:25;pointer-events:none;
}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
@media (max-width:560px){
  .fit{transform:none}
  .phone{width:100vw;height:100vh;padding:0;border-radius:0;background:none;box-shadow:none}
  .screen{width:100%;height:100%;border-radius:0}
  .device{width:100%;height:100%;transform:none}
  .island,.status,.homebar{display:none}
}

/* header */
.top{
  display:flex;align-items:center;gap:8px;padding:16px 16px 12px;
  border-bottom:1px solid var(--line); background:var(--surface); flex:0 0 auto;
}
.top h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1}
.iconbtn{
  border:none;background:var(--raised);color:var(--ink);width:32px;height:32px;
  border-radius:10px;font-size:15px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.linkbtn{border:none;background:none;color:var(--brand);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px}

/* content */
.body{flex:1;overflow-y:auto;padding:18px 16px 26px;display:flex;flex-direction:column;gap:14px}
.body::-webkit-scrollbar{width:0}
h2{font-size:20px;font-weight:700;margin:0;letter-spacing:-.02em}
.lead{font-size:13px;color:var(--sub);margin:-8px 0 0}
.label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:6px 0 -6px}

/* cards */
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0;font-size:14px;font-weight:600}
.card p{margin:4px 0 0;font-size:12.5px;color:var(--sub);line-height:1.45}
.hero{
  background:linear-gradient(140deg,var(--brand) 0%,var(--brand-ink) 100%);
  color:#fff;border:none;border-radius:18px;padding:16px;cursor:pointer;text-align:left;
  width:100%;font:inherit;display:block;
}
.hero .h-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .h-ev{font-size:16px;font-weight:700}
.hero .h-amt{font-size:22px;font-weight:700;margin:10px 0 2px;letter-spacing:-.02em}
.hero .h-sub{font-size:12.5px;opacity:.85}
.hero .chip{background:rgba(255,255,255,.2);border-radius:99px;padding:4px 10px;font-size:11px;font-weight:600}

/* buttons */
.btn{
  width:100%;border-radius:12px;padding:14px;font:inherit;font-size:14.5px;font-weight:600;
  cursor:pointer;border:1px solid transparent;transition:transform .06s ease,opacity .15s ease;
}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.quiet{background:none;color:var(--sub);border:none;font-weight:500;font-size:13px;padding:8px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary[disabled]{background:var(--line);color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-direction:column;gap:10px}

/* list rows */
.row{
  display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;cursor:pointer;
  font:inherit;color:inherit;text-align:left;
}
.row:active{background:var(--raised)}
.row .r-main{flex:1;min-width:0}
.row .r-t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r-s{font-size:12px;color:var(--sub);margin-top:3px}
.chev{color:var(--faint);font-size:16px}

/* pills */
.pill{font-size:11px;font-weight:700;padding:5px 9px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.p-review{background:var(--brand-soft);color:var(--brand-ink)}
.p-approved{background:var(--ok-soft);color:var(--ok)}
.p-returned{background:var(--bad-soft);color:var(--bad)}
.p-notsent{background:var(--warn-soft);color:var(--warn)}
.p-draft{background:var(--raised);color:var(--sub)}

/* forms */
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:15px;
}
.field textarea{min-height:82px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--brand);outline-offset:-1px;border-color:transparent}
.field .hint{font-size:11.5px;color:var(--faint);margin-top:6px}
.field.bad input,.field.bad textarea,.field.bad .drop{border-color:var(--bad)}
.err{font-size:11.5px;color:var(--bad);margin-top:6px;font-weight:600}
.drop{
  border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;
  cursor:pointer;display:block;background:var(--surface);
}
.drop .d-t{font-size:13.5px;font-weight:600;color:var(--brand)}
.drop .d-s{font-size:11.5px;color:var(--faint);margin-top:4px}
.drop.filled{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.drop.filled .d-t{color:var(--ok)}
input[type=file]{display:none}
.checkline{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font-size:13px}
.checkline input{accent-color:var(--brand);width:17px;height:17px;margin:1px 0 0;flex:0 0 auto}
.banner{border-radius:var(--r);padding:13px 14px;font-size:13px;line-height:1.45}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--brand-soft);color:var(--brand-ink)}
.banner strong{display:block;font-size:13.5px;margin-bottom:2px}

/* summary + steps */
.sum{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum div{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.sum div:last-child{border-bottom:none}
.sum span{width:88px;color:var(--sub);flex:0 0 auto;font-size:12.5px}
.sum b{font-weight:600;word-break:break-word}
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;gap:12px;padding:2px 0}
.dot{width:16px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center}
.dot i{width:13px;height:13px;border-radius:50%;border:2px solid var(--line);margin-top:3px;display:block}
.dot u{flex:1;width:2px;background:var(--line);margin:3px 0}
.step.done .dot i{background:var(--ok);border-color:var(--ok)}
.step.now .dot i{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.step .s-t{font-size:13.5px;font-weight:600;padding-bottom:14px}
.step.next .s-t{color:var(--faint);font-weight:500}
.step .s-s{display:block;font-size:11.5px;color:var(--sub);font-weight:500;margin-top:2px}

/* sending */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.bar{width:180px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:var(--brand);border-radius:99px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}
.badge{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}

/* tabs */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface);flex:0 0 auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:none;background:none;padding:11px 0 14px;cursor:pointer;color:var(--faint);font:inherit;font-size:10.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px}
.tabs button .ic{font-size:17px;line-height:1}
.tabs button.on{color:var(--brand)}

/* toast */
.toast{
  position:absolute;left:16px;right:16px;bottom:88px;background:var(--ink);color:var(--surface);
  padding:12px 14px;border-radius:12px;font-size:13px;font-weight:500;
  opacity:0;transform:translateY(8px);transition:.2s ease;pointer-events:none;z-index:9;
}
.toast.show{opacity:1;transform:none}

/* ---- hidden session log (Ctrl/Cmd + Shift + L, or triple-click the background) ---- */
.panel{
  position:fixed;top:20px;right:20px;width:400px;z-index:999;display:none;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  padding:16px;box-shadow:0 20px 60px rgba(18,22,40,.22);
  flex-direction:column;gap:10px;max-height:calc(100vh - 40px);
}
.panel.open{display:flex}
.panel h2{font-size:14px;font-weight:700;margin:0}
.panel .sm{font-size:11.5px;color:var(--sub);margin:0}
.panel .r{display:flex;gap:8px}
.panel input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.pbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 10px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;flex:1}
.pbtn.go{background:var(--brand);color:#fff;border-color:transparent}
.logwrap{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--raised);min-height:200px}
.logrow{display:flex;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line);font-size:11px;align-items:baseline}
.logrow:last-child{border-bottom:none}
.logrow .t{color:var(--faint);font-variant-numeric:tabular-nums;flex:0 0 42px}
.logrow .k{font-weight:700;flex:0 0 52px;text-transform:uppercase;font-size:9.5px;letter-spacing:.04em}
.logrow .d{flex:1;word-break:break-word}
.k.tap{color:var(--brand)}.k.screen{color:var(--sub)}.k.field{color:var(--warn)}
.k.note{color:var(--ink)}.k.error{color:var(--bad)}.k.session{color:var(--ok)}
.counts{display:flex;gap:12px;font-size:11.5px;color:var(--sub)}
.counts b{color:var(--ink)}
/* ---- mockup sheet ---- */
body{display:block;padding:48px 32px 90px;background:#EDEFF4}
.sheet-head{max-width:1400px;margin:0 auto 44px;text-align:center}
.sheet-head h1{font-size:30px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em}
.sheet-head p{margin:0;color:var(--sub);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,426px);gap:64px 44px;justify-content:center;max-width:1900px;margin:0 auto}
.shot{display:flex;flex-direction:column;align-items:center;gap:16px}
.shot .cap{font-size:13.5px;font-weight:700;color:var(--ink);text-align:center}
.shot .cap span{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:4px}
.phone,.device{pointer-events:none}
.group{grid-column:1/-1;margin:30px 0 -20px;text-align:center}
.group h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0}
.panel{display:none}

</style>
</head>
<body>
<div class="sheet-head">
  <h1>Campus Budget — screen mockups</h1>
  <p>iPhone 17 · 402 × 874 pt · shown at 1× · 17 states across the request, tracking and reimbursement flows</p>
</div>
<div class="grid" id="grid"></div>
<script>

/* ---------------- data ---------------- */
const seed = () => ({
  failNext:false,
  tab:'home',
  view:{name:'home'},
  draft:null,
  bill:null,
  requests:[
    {id:'r1',name:'Annual Fest',amount:1000000,date:'2026-10-29',purpose:'Stage, sound and lighting for the two-day fest',file:'annual-fest-quote.pdf',
     status:'review',holder:'Bangalore Branch',opened:true,sentOn:'28 Sep',
     stages:[{t:'Submitted',s:'28 Sep',st:'done'},{t:'Admin Office opened it',s:'30 Sep',st:'done'},{t:'Bangalore Branch reviewing',s:'Since 2 Oct',st:'now'},{t:'Decision',s:'Not started',st:'next'}]},
    {id:'r2',name:'Sports Day',amount:18000,date:'2026-09-26',purpose:'Refreshments and medals',file:'sports-quote.jpg',
     status:'returned',holder:'You',opened:true,sentOn:'20 Sep',reason:'Amount does not match the quotation',reasonSub:'The quotation totals ₹16,200, the request asks for ₹18,000',by:'Bangalore Branch, 3 Oct',
     fixes:['Attach a quotation for the full amount','Or lower the request to ₹16,200'],
     stages:[{t:'Submitted',s:'20 Sep',st:'done'},{t:'Admin Office opened it',s:'22 Sep',st:'done'},{t:'Returned to you',s:'3 Oct',st:'now'}]},
    {id:'r3',name:'Orientation Snacks',amount:6500,date:'2026-09-12',purpose:'Snacks for 120 first-year students',file:'sharma-quote.pdf',
     status:'approved',holder:'—',opened:true,sentOn:'4 Sep',eventDone:false,
     stages:[{t:'Submitted',s:'4 Sep',st:'done'},{t:'Admin Office opened it',s:'6 Sep',st:'done'},{t:'Bangalore Branch reviewed',s:'10 Sep',st:'done'},{t:'Approved',s:'10 Sep',st:'done'}]},
    {id:'r4',name:'Tech Fest',amount:22000,date:'2026-11-14',purpose:'Speaker travel and hosting',file:null,
     status:'draft',holder:'You',opened:false,stages:[]},
    {id:'r5',name:'Cultural Night',amount:30000,date:'2026-10-04',purpose:'Costumes and backdrop',file:'cultural-quote.pdf',
     status:'notsent',holder:'You',opened:false,stages:[]}
  ],
  bills:[]
});
let S = seed();

const META = {
  draft:    {label:'Draft',     cls:'p-draft',    say:'You saved it. Nothing has been sent.'},
  notsent:  {label:'Not sent',  cls:'p-notsent',  say:'The send failed. Nothing reached the Admin Office.'},
  review:   {label:'In review', cls:'p-review',   say:'Someone has it. The screen names who.'},
  returned: {label:'Returned',  cls:'p-returned', say:'Sent back with a reason. Edit and resubmit.'},
  approved: {label:'Approved',  cls:'p-approved', say:'Money cleared. Upload the bill after the event.'},
  withdrawn:{label:'Withdrawn', cls:'p-draft',    say:'You pulled it back before it was opened.'}
};

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const req = id => S.requests.find(r => r.id === id);

function inr(n){
  const x = Math.round(Number(n) || 0), s = String(x), last = s.slice(-3), rest = s.slice(0, -3);
  return '₹' + (rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' : '') + last;
}
function nice(d){
  if(!d) return '—';
  const p = d.split('-'); if(p.length !== 3) return d;
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Number(p[2]) + ' ' + m[Number(p[1]) - 1] + ' ' + p[0];
}
function today(){
  const d = new Date(), m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return d.getDate() + ' ' + m[d.getMonth()];
}
function go(name, arg){ S.view = {name:name, arg:arg}; render(); $('app').scrollTop = 0; }
let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}
const pill = s => '<span class="pill ' + META[s].cls + '">' + META[s].label + '</span>';

function shell(title, bodyHtml, o){
  o = o || {};
  const back = o.back ? '<button class="iconbtn" data-act="go" data-to="' + o.back + '" data-arg="' + (o.backArg||'') + '">‹</button>' : '';
  const right = o.right ? '<button class="linkbtn" data-act="' + o.right.act + '">' + o.right.label + '</button>' : '';
  const tabs = o.hideTabs ? '' : tabBar();
  return '<div class="top">' + back + '<h1>' + esc(title) + '</h1>' + right + '</div>' +
         '<div class="body" id="body">' + bodyHtml + '</div>' + tabs;
}
function tabBar(){
  const t = [['home','⌂','Home'],['requests','▤','Requests'],['bills','₹','Bills'],['help','?','Help']];
  return '<div class="tabs">' + t.map(x =>
    '<button class="' + (S.tab === x[0] ? 'on' : '') + '" data-act="tab" data-to="' + x[0] + '">' +
    '<span class="ic">' + x[1] + '</span>' + x[2] + '</button>').join('') + '</div>';
}
function rowHtml(r){
  const sub = {
    draft:'Saved, never sent',
    notsent:'The send failed — try again',
    review:'With ' + r.holder,
    returned:'Needs changes from you',
    approved:(r.eventDone ? 'Event done — bill due' : 'Approved — mark done after the event')
  }[r.status];
  return '<button class="row" data-act="open" data-id="' + r.id + '">' +
    '<div class="r-main"><div class="r-t">' + esc(r.name) + '</div>' +
    '<div class="r-s">' + inr(r.amount) + ' · ' + sub + '</div></div>' +
    pill(r.status) + '<span class="chev">›</span></button>';
}
function stepsHtml(stages){
  return '<div class="steps">' + stages.map((s, i) =>
    '<div class="step ' + s.st + '"><div class="dot"><i></i>' + (i < stages.length - 1 ? '<u></u>' : '') + '</div>' +
    '<div class="s-t">' + esc(s.t) + '<span class="s-s">' + esc(s.s) + '</span></div></div>').join('') + '</div>';
}

/* ---------------- screens ---------------- */
const V = {};

V.home = () => {
  const live = S.requests.filter(r => r.status === 'review');
  const todo = S.requests.filter(r => r.status === 'returned' || r.status === 'notsent');
  const rest = S.requests.filter(r => r.status === 'draft' || r.status === 'approved' || r.status === 'withdrawn');
  let h = '<h2>Hello, Ayush</h2><p class="lead">Council treasurer · Annual Fest 2026</p>';
  if(live.length){
    h += live.map(r =>
      '<button class="hero" data-act="open" data-id="' + r.id + '">' +
      '<div class="h-top"><span class="h-ev">' + esc(r.name) + '</span><span class="chip">In review</span></div>' +
      '<div class="h-amt">' + inr(r.amount) + '</div>' +
      '<div class="h-sub">With ' + esc(r.holder) + ' · nothing pending on your side</div></button>').join('');
  } else {
    h += '<div class="card"><h3>Nothing in review</h3><p>Start a request and you can follow it from here.</p></div>';
  }
  h += '<div class="actions"><button class="btn primary" data-act="new">New request</button>' +
       '<div class="grid2"><button class="btn ghost" data-act="tab" data-to="requests">My requests</button>' +
       '<button class="btn ghost" data-act="uploadbill">Upload a bill</button></div></div>';
  if(todo.length){ h += '<p class="label">Needs you</p>' + todo.map(rowHtml).join(''); }
  if(rest.length){ h += '<p class="label">Everything else</p>' + rest.map(rowHtml).join(''); }
  return shell('Home', h, {hideTabs:false});
};

V.requests = () => {
  const g = [
    ['Needs you', S.requests.filter(r => r.status === 'returned' || r.status === 'notsent')],
    ['In progress', S.requests.filter(r => r.status === 'review')],
    ['Done', S.requests.filter(r => r.status === 'approved' || r.status === 'draft' || r.status === 'withdrawn')]
  ];
  let h = '';
  g.forEach(x => { if(x[1].length) h += '<p class="label">' + x[0] + ' (' + x[1].length + ')</p>' + x[1].map(rowHtml).join(''); });
  h += '<button class="btn primary" data-act="new" style="margin-top:8px">New request</button>';
  return shell('Requests', h);
};

V.bills = () => {
  const billed = S.bills.map(b => b.rid);
  const approved = S.requests.filter(r => r.status === 'approved' && billed.indexOf(r.id) === -1);
  const due = approved.filter(r => r.eventDone);
  const soon = approved.filter(r => !r.eventDone);
  const line = (r, note) => '<button class="row" data-act="uploadbill" data-id="' + r.id + '"><div class="r-main">' +
    '<div class="r-t">' + esc(r.name) + '</div><div class="r-s">' + note + '</div></div>' +
    '<span class="chev">›</span></button>';
  let h = '';
  if(due.length) h += '<p class="label">Bill due (' + due.length + ')</p>' +
    due.map(r => line(r, 'Event done · approved ' + inr(r.amount))).join('');
  if(soon.length) h += '<p class="label">Approved, event still to come</p>' +
    soon.map(r => line(r, 'Approved ' + inr(r.amount) + ' · mark done when it is over')).join('');
  if(S.bills.length){
    h += '<p class="label">Uploaded</p>' + S.bills.map(b =>
      '<div class="card"><h3>' + esc(b.vendor) + ' · ' + inr(b.amount) + '</h3>' +
      '<p>' + esc(b.event) + ' · uploaded ' + esc(b.on) + '</p></div>').join('');
  }
  if(!due.length && !soon.length && !S.bills.length)
    h += '<div class="card"><h3>Nothing yet</h3><p>Bills can only be uploaded against an approved request.</p></div>';
  h += '<div class="banner info" style="margin-top:6px"><strong>No paper copy needed</strong>A clear photo of the bill is enough, as long as the amount and vendor name are readable.</div>';
  return shell('Bills', h);
};

V.help = () => {
  let h = '<h2>What each stage means</h2><div class="sum">' +
    ['draft','notsent','review','returned','approved'].map(k =>
      '<div><span>' + META[k].label + '</span><b style="font-weight:500">' + META[k].say + '</b></div>').join('') + '</div>';
  h += '<p class="label">What a bill must show</p><div class="card"><p style="margin:0">' +
       'An amount matching the approved request · vendor name and date readable · JPG or PDF under 5 MB</p></div>';
  h += '<p class="label">Demo controls</p>' +
       '<label class="checkline"><input type="checkbox" data-act="fail" ' + (S.failNext ? 'checked' : '') + '>' +
       '<span>Make the next send fail (for testing the recovery screen)</span></label>' +
       '<button class="btn ghost" data-act="reset" style="margin-top:10px">Reset demo data</button>';
  return shell('Help', h);
};

V.form = () => {
  const d = S.draft, e = d.errors || {};
  const f = (key, label, extra) =>
    '<div class="field ' + (e[key] ? 'bad' : '') + '"><label for="i-' + key + '">' + label + '</label>' + extra +
    (e[key] ? '<div class="err">' + e[key] + '</div>' : '') + '</div>';
  let h = '';
  if(Object.keys(e).length)
    h += '<div class="banner bad"><strong>' + Object.keys(e).length + ' fields need attention</strong>Nothing has been sent. Everything you typed is saved.</div>';
  h += f('name','Event name','<input id="i-name" data-bind="name" value="' + esc(d.name) + '" placeholder="Annual Fest" autocomplete="off">');
  h += f('amount','Amount needed','<input id="i-amount" data-bind="amount" value="' + esc(d.amount) + '" inputmode="numeric" placeholder="10000">' +
        (d.amount ? '<div class="hint">' + inr(d.amount) + '</div>' : ''));
  h += f('date','Event date','<input id="i-date" data-bind="date" type="date" value="' + esc(d.date) + '">');
  h += f('purpose','Purpose','<textarea id="i-purpose" data-bind="purpose" placeholder="Why the money is needed">' + esc(d.purpose) + '</textarea>');
  h += f('file','Quotation',
    '<label class="drop ' + (d.file ? 'filled' : '') + '" for="i-file">' +
    '<div class="d-t">' + (d.file ? '✓ ' + esc(d.file) : '+ Attach a file') + '</div>' +
    '<div class="d-s">' + (d.file ? 'Tap to replace' : 'PDF or JPG, max 5 MB') + '</div></label>' +
    '<input id="i-file" type="file" accept=".pdf,.jpg,.jpeg,.png" data-file="draft">');
  h += '<button class="btn primary" data-act="review">Continue</button>' +
       '<p class="lead" style="text-align:center">You will see a review screen before anything is sent.</p>';
  return shell(d.id ? 'Edit request' : 'New request', h, {right:{act:'cancel', label:'Cancel'}, hideTabs:true});
};

V.review = () => {
  const d = S.draft;
  let h = '<div class="banner info"><strong>Check before sending</strong>You can withdraw until the Admin Office opens it.</div>';
  h += '<div class="sum">' +
    '<div><span>Event</span><b>' + esc(d.name) + '</b></div>' +
    '<div><span>Amount</span><b>' + inr(d.amount) + '</b></div>' +
    '<div><span>Date</span><b>' + nice(d.date) + '</b></div>' +
    '<div><span>Purpose</span><b>' + esc(d.purpose) + '</b></div>' +
    '<div><span>Quotation</span><b>' + esc(d.file) + '</b></div></div>';
  h += '<div class="card"><h3>Where this goes</h3><p>Admin Office, then Bangalore Branch. Decisions usually take 5 to 7 days.</p></div>';
  h += '<div class="actions"><button class="btn primary" data-act="send">Submit request</button>' +
       '<button class="btn ghost" data-act="form">Back and edit</button></div>';
  return shell('Review', h, {hideTabs:true});
};

V.sending = () => shell('Sending',
  '<div class="center"><div class="bar"><i></i></div>' +
  '<h2 style="margin-top:8px">Sending to Admin Office</h2>' +
  '<p class="lead">Do not close this screen</p></div>', {hideTabs:true});

V.notsent = () => {
  let h = '<div class="center" style="flex:0 0 auto;align-items:flex-start;text-align:left">' +
    '<div class="badge bad">!</div><h2>Request was not submitted</h2>' +
    '<p class="lead">The college server did not respond.</p></div>';
  h += '<div class="card"><h3>Your entries are safe</h3><p>Saved to your account, not just this device.</p></div>';
  h += '<div class="card"><h3>This is not a rejection</h3><p>Nothing reached the Admin Office, so nobody has seen it.</p></div>';
  h += '<div class="actions"><button class="btn primary" data-act="send">Try again</button>' +
       '<button class="btn ghost" data-act="savedraft">Save as draft and go home</button></div>';
  return shell('Not sent', h, {hideTabs:true});
};

V.submitted = () => {
  const r = req(S.view.arg);
  let h = '<div class="center" style="flex:0 0 auto;align-items:flex-start;text-align:left">' +
    '<div class="badge ok">✓</div><h2>Request submitted</h2>' +
    '<p class="lead">' + esc(r.name) + ' · ' + inr(r.amount) + '</p></div>';
  h += '<div class="card"><h3>Now with the Admin Office</h3><p>No need to visit the admin block. You will see it move from here.</p></div>';
  h += '<div class="actions"><button class="btn primary" data-act="open" data-id="' + r.id + '">Track this request</button>' +
       '<button class="btn ghost" data-act="tab" data-to="home">Go home</button>' +
       '<button class="btn danger" data-act="withdraw" data-id="' + r.id + '">Withdraw request</button></div>' +
       '<p class="lead" style="text-align:center">You can withdraw until the Admin Office opens it.</p>';
  return shell('Submitted', h, {hideTabs:true});
};

V.track = () => {
  const r = req(S.view.arg);
  let h = '<h2>' + esc(r.name) + '</h2><p class="lead">' + inr(r.amount) + ' · sent ' + esc(r.sentOn) + '</p>';
  h += '<div class="card"><h3>Now with: ' + esc(r.holder) + '</h3><p>Updated today · nothing pending on your side.</p></div>';
  h += '<p class="label">Progress</p>' + stepsHtml(r.stages);
  h += r.opened
    ? '<button class="btn ghost" data-act="askchange" data-id="' + r.id + '">Ask for a change</button>' +
      '<p class="lead" style="text-align:center">Withdraw closed once the Admin Office opened this.</p>'
    : '<button class="btn danger" data-act="withdraw" data-id="' + r.id + '">Withdraw request</button>' +
      '<p class="lead" style="text-align:center">Still withdrawable — the Admin Office has not opened it yet.</p>';
  return shell('Track', h, {back:'tab', backArg:'requests', hideTabs:true});
};

V.returned = () => {
  const r = req(S.view.arg);
  let h = '<div class="banner bad"><strong>Returned, not approved</strong>By ' + esc(r.by) + '</div>';
  h += '<div class="card"><h3>' + esc(r.reason) + '</h3><p>' + esc(r.reasonSub) + '</p></div>';
  h += '<p class="label">To fix</p>' + r.fixes.map(x =>
    '<label class="checkline"><input type="checkbox"><span>' + esc(x) + '</span></label>').join('');
  h += '<p class="label">History</p>' + stepsHtml(r.stages);
  h += '<div class="actions"><button class="btn primary" data-act="edit" data-id="' + r.id + '">Edit and resubmit</button>' +
       '<button class="btn ghost" data-act="tab" data-to="home">Go home</button></div>';
  return shell(r.name, h, {back:'tab', backArg:'requests', hideTabs:true});
};

V.approved = () => {
  const r = req(S.view.arg);
  const bill = S.bills.find(b => b.rid === r.id);
  let h = '<div class="banner info" style="background:var(--ok-soft);color:var(--ok)"><strong>Approved — ' + inr(r.amount) + '</strong>Cleared by Bangalore Branch</div>';
  h += '<p class="label">History</p>' + stepsHtml(r.stages);
  if(bill){
    h += '<div class="card"><h3>Bill uploaded</h3><p>' + esc(bill.vendor) + ' · ' + inr(bill.amount) + ' · ' + esc(bill.on) + '</p></div>';
  } else if(r.eventDone){
    h += '<div class="card"><h3>Event marked done</h3><p>This is waiting in Bills for its receipt.</p></div>' +
         '<button class="btn primary" data-act="uploadbill" data-id="' + r.id + '">Upload the bill</button>';
  } else {
    h += '<div class="card"><h3>Event still to come</h3><p>Mark it done once the event is over and the money is spent. It then waits in Bills for the receipt.</p></div>' +
         '<button class="btn primary" data-act="markdone" data-id="' + r.id + '">Mark event as done</button>' +
         '<button class="btn ghost" data-act="uploadbill" data-id="' + r.id + '">Upload the bill now</button>';
  }
  return shell(r.name, h, {back:'tab', backArg:'requests', hideTabs:true});
};

V.draftview = () => {
  const r = req(S.view.arg);
  let h = '<div class="banner info">' + (r.status === 'notsent'
    ? '<strong>The send failed</strong>Nothing reached the Admin Office. Your entries are safe.'
    : '<strong>Saved as a draft</strong>This has never been sent.') + '</div>';
  h += '<div class="sum"><div><span>Event</span><b>' + esc(r.name) + '</b></div>' +
    '<div><span>Amount</span><b>' + inr(r.amount) + '</b></div>' +
    '<div><span>Date</span><b>' + nice(r.date) + '</b></div>' +
    '<div><span>Quotation</span><b>' + esc(r.file || 'Not attached') + '</b></div></div>';
  h += '<div class="actions"><button class="btn primary" data-act="edit" data-id="' + r.id + '">' +
       (r.status === 'notsent' ? 'Open and try again' : 'Continue editing') + '</button>' +
       '<button class="btn ghost" data-act="tab" data-to="home">Go home</button></div>';
  return shell(r.name, h, {back:'tab', backArg:'requests', hideTabs:true});
};

V.uploadbill = () => {
  const b = S.bill, approved = S.requests.filter(r => r.status === 'approved');
  const r = req(b.rid);
  const gap = r && Number(b.amount) && Number(b.amount) !== r.amount;
  const ready = b.rid && b.vendor.trim() && Number(b.amount) > 0 && b.photo && b.c3;
  let h = '<div class="field"><label for="i-ev">Event</label><select id="i-ev" data-bind-bill="rid">' +
    approved.map(x => '<option value="' + x.id + '"' + (x.id === b.rid ? ' selected' : '') + '>' +
      esc(x.name) + ' — approved ' + inr(x.amount) + '</option>').join('') +
    '</select><div class="hint">Only approved requests appear here.</div></div>';
  h += '<div class="field"><label for="i-vn">Vendor</label><input id="i-vn" data-bind-bill="vendor" value="' + esc(b.vendor) + '" placeholder="Sharma Caterers" autocomplete="off"></div>';
  h += '<div class="field"><label for="i-am">Amount on the bill</label><input id="i-am" data-bind-bill="amount" value="' + esc(b.amount) + '" inputmode="numeric" placeholder="6500">' +
    (gap ? '<div class="err">This does not match the approved ' + inr(r.amount) + '. It will be queried.</div>'
         : '<div class="hint">Approved: ' + (r ? inr(r.amount) : '—') + '</div>') + '</div>';
  h += '<div class="field"><label>Bill photo</label>' +
    '<label class="drop ' + (b.photo ? 'filled' : '') + '" for="i-ph"><div class="d-t">' +
    (b.photo ? '✓ ' + esc(b.photo) : '+ Add a photo') + '</div><div class="d-s">' +
    (b.photo ? 'Tap to replace' : 'JPG or PDF, max 5 MB') + '</div></label>' +
    '<input id="i-ph" type="file" accept="image/*,.pdf" data-file="bill"></div>';
  h += '<p class="label">Before you upload</p>';
  h += '<label class="checkline"><input type="checkbox" data-check="c3"' + (b.c3 ? ' checked' : '') +
       '><span>The amount on the bill matches the approved amount</span></label>';
  h += '<button class="btn primary" data-act="upload" ' + (ready ? '' : 'disabled') + ' style="margin-top:6px">Upload bill</button>';
  if(!ready) h += '<p class="lead" style="text-align:center">Add the photo and confirm the amount to enable upload.</p>';
  return shell('Upload bill', h, {right:{act:'cancel', label:'Cancel'}, hideTabs:true});
};

V.billdone = () => {
  const b = S.bills[S.bills.length - 1];
  let h = '<div class="center" style="flex:0 0 auto;align-items:flex-start;text-align:left">' +
    '<div class="badge ok">✓</div><h2>Bill received</h2>' +
    '<p class="lead">' + inr(b.amount) + ' · ' + esc(b.vendor) + '</p></div>';
  h += '<div class="card"><h3>No paper copy needed</h3><p>The Admin Office can see this bill now.</p></div>';
  h += '<p class="label">Progress</p>' + stepsHtml([
    {t:'Uploaded', s:'Just now', st:'done'},
    {t:'Admin Office check', s:'Not started · usually 2 days', st:'next'},
    {t:'Reimbursed', s:'Not started', st:'next'}]);
  h += '<button class="btn primary" data-act="tab" data-to="home">Go home</button>';
  return shell('Uploaded', h, {hideTabs:true});
};

function statusBar(){
  return '<div class="island"></div>' +
    '<div class="status"><span>9:41</span><span class="right">' +
    '<span class="bars"><i></i><i></i><i></i><i></i></span>' +
    '<span class="wifi">\u25D7</span><span class="batt"><i></i></span></span></div>';
}
function shot(title, note, html){
  return '<div class="shot"><div class="phone"><div class="device">' +
    statusBar() + '<div style="flex:1;display:flex;flex-direction:column;min-height:0">' + html +
    '</div><div class="homebar"></div></div></div>' +
    '<div class="cap">' + title + '<span>' + note + '</span></div></div>';
}
function group(name){ return '<div class="group"><h2>' + name + '</h2></div>'; }

const filled = () => ({id:null,name:'Annual Fest',amount:'1000000',date:'2026-10-29',
  purpose:'Stage, sound and lighting for the two-day fest',file:'annual-fest-quote.pdf',errors:{}});

const SHOTS = [
  ['group','Main surfaces'],
  ['Home','One live request, everything else grouped', () => { S = seed(); S.tab='home'; return V.home(); }],
  ['Requests','Grouped by what needs the user', () => { S = seed(); S.tab='requests'; return V.requests(); }],
  ['Bills','Only approved requests can be billed', () => { S = seed(); S.tab='bills';
     S.bills=[{rid:'r3',event:'Orientation Snacks',vendor:'Sharma Caterers',amount:6500,on:'12 Sep'}]; return V.bills(); }],
  ['Help','Status glossary — the fix for mixed labels', () => { S = seed(); S.tab='help'; return V.help(); }],

  ['group','Making a request'],
  ['New request','Empty form, review promised up front', () => { S = seed(); S.draft = {id:null,name:'',amount:'',date:'',purpose:'',file:null,errors:{}}; return V.form(); }],
  ['Validation errors','Nothing sent, entries kept', () => { S = seed();
     S.draft = {id:null,name:'Annual Fest',amount:'',date:'2026-10-29',purpose:'Stage, sound and lighting',file:null,
       errors:{amount:'Enter an amount', file:'Attach at least one quotation'}}; return V.form(); }],
  ['Review','Withdraw rule stated before sending', () => { S = seed(); S.draft = filled(); return V.review(); }],
  ['Sending','Explicit and interruptible', () => { S = seed(); return V.sending(); }],
  ['Not sent','Failure separated from rejection', () => { S = seed(); S.draft = filled(); return V.notsent(); }],
  ['Submitted','Withdraw live — not opened yet', () => { S = seed();
     const r = S.requests[0]; r.opened = false; r.holder = 'Admin Office'; S.view={name:'submitted',arg:r.id}; return V.submitted(); }],

  ['group','Tracking and outcomes'],
  ['Track — still withdrawable','Admin Office has not opened it', () => { S = seed();
     const r = S.requests[0]; r.opened=false; r.holder='Admin Office';
     r.stages=[{t:'Submitted',s:'28 Sep',st:'done'},{t:'Admin Office opened it',s:'Not started',st:'next'},
               {t:'Bangalore Branch reviewing',s:'Not started',st:'next'},{t:'Decision',s:'Not started',st:'next'}];
     S.view={name:'track',arg:r.id}; return V.track(); }],
  ['Track — opened','Named holder, withdraw closed', () => { S = seed(); S.view={name:'track',arg:'r1'}; return V.track(); }],
  ['Returned','Reason plus a fix list', () => { S = seed(); S.view={name:'returned',arg:'r2'}; return V.returned(); }],
  ['Approved — event done','Bill upload is the next step', () => { S = seed(); req('r3').eventDone = true; S.view={name:'approved',arg:'r3'}; return V.approved(); }],

  ['group','Claiming the money'],
  ['Approved — event ahead','Mark done when the event is over', () => { S = seed(); S.view={name:'approved',arg:'r3'}; return V.approved(); }],
  ['Bills — bill due','Marked done, now waiting for a receipt', () => { S = seed(); S.tab='bills';
     req('r3').eventDone = true; return V.bills(); }],
  ['Upload bill — locked','Upload waits for the photo and the amount check', () => { S = seed();
     S.bill={rid:'r3',vendor:'',amount:'6500',photo:null,c3:false}; return V.uploadbill(); }],
  ['Upload bill — ready','Photo attached, amount confirmed', () => { S = seed();
     S.bill={rid:'r3',vendor:'Sharma Caterers',amount:'6500',photo:'bill-sharma.jpg',c3:true}; return V.uploadbill(); }],
  ['Bill uploaded','Filled dots mean finished only', () => { S = seed();
     S.bills=[{rid:'r3',event:'Orientation Snacks',vendor:'Sharma Caterers',amount:6500,on:'today'}]; return V.billdone(); }]
];

let out = '';
SHOTS.forEach(s => { out += (s[0] === 'group') ? group(s[1]) : shot(s[0], s[1], s[2]()); });
document.getElementById('grid').innerHTML = out;

</script>
</body>
</html>
