<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Budget - final prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --page: #E4E6F3;
      --surface: #FFFFFF;
      --raised: #F1F1FA;
      --ink: #12111F;
      --sub: #56536D;
      --faint: #8B87A3;
      --line: #DEDCEC;
      --line-strong: #C7C4DD;
      --brand: #4B3DD1;
      --brand-2: #3A2DAE;
      --brand-soft: #E6E2FB;
      --brand-ink: #2C2280;
      --ok: #0E8A4B;
      --ok-2: #0A6E3C;
      --ok-soft: #DEF5E7;
      --warn: #A15E00;
      --warn-2: #7E4A00;
      --warn-soft: #FCEDD3;
      --bad: #C4281C;
      --bad-2: #9E1F16;
      --bad-soft: #FBE2DF;
      --shadow: 0 24px 60px rgba(18, 14, 50, .24);
      --r: 14px;
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    /* the phone is built at native iPhone 17 pixels: 1206 x 2622 screen.
   the UI is laid out in 402 x 874 points and scaled x3, so text stays vector-sharp. */
    .fit {
      transform: scale(var(--k, .32));
      transform-origin: center center
    }

    .phone {
      width: 1278px;
      height: 2694px;
      padding: 36px;
      border-radius: 198px;
      position: relative;
      background: linear-gradient(150deg, #3A3E4B, #101218 45%, #4A4F5E);
      box-shadow: 0 60px 160px rgba(16, 20, 38, .35);
    }

    .screen {
      width: 1206px;
      height: 2622px;
      background: var(--surface);
      border-radius: 165px;
      overflow: hidden;
      position: relative;
    }

    .device {
      width: 402px;
      height: 874px;
      transform: scale(3);
      transform-origin: top left;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--surface);
    }

    /* Dynamic Island */
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 124px;
      height: 36px;
      background: #000;
      border-radius: 20px;
      z-index: 30;
    }

    /* status bar */
    .status {
      flex: 0 0 auto;
      height: 54px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 30px 7px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--ink);
      background: var(--surface);
    }

    .status .right {
      display: flex;
      align-items: flex-end;
      gap: 5px
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px
    }

    .bars i {
      width: 3px;
      background: var(--ink);
      border-radius: 1px
    }

    .bars i:nth-child(1) {
      height: 4px
    }

    .bars i:nth-child(2) {
      height: 6px
    }

    .bars i:nth-child(3) {
      height: 9px
    }

    .bars i:nth-child(4) {
      height: 11px
    }

    .wifi {
      font-size: 13px;
      line-height: 1
    }

    .batt {
      width: 24px;
      height: 12px;
      border: 1.5px solid var(--ink);
      border-radius: 4px;
      position: relative;
      opacity: .9
    }

    .batt::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 3.5px;
      width: 2px;
      height: 5px;
      background: var(--ink);
      border-radius: 0 2px 2px 0
    }

    .batt i {
      position: absolute;
      inset: 2px;
      width: 70%;
      background: var(--ink);
      border-radius: 2px;
      display: block
    }

    /* home indicator */
    .homebar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 5px;
      border-radius: 3px;
      background: var(--ink);
      opacity: .3;
      z-index: 25;
      pointer-events: none;
    }

    #app {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    @media (max-width:560px) {
      .fit {
        transform: none
      }

      .phone {
        width: 100vw;
        height: 100vh;
        padding: 0;
        border-radius: 0;
        background: none;
        box-shadow: none
      }

      .screen {
        width: 100%;
        height: 100%;
        border-radius: 0
      }

      .device {
        width: 100%;
        height: 100%;
        transform: none
      }

      .island,
      .status,
      .homebar {
        display: none
      }
    }

    /* header */
    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      flex: 0 0 auto;
    }

    .top h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -.01em;
      flex: 1
    }

    .iconbtn {
      border: 1.5px solid var(--line-strong);
      background: var(--raised);
      color: var(--ink);
      width: 33px;
      height: 33px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      box-shadow: 0 1px 0 rgba(18, 17, 31, .04);
    }

    .iconbtn:active {
      transform: scale(.94)
    }

    .linkbtn {
      border: none;
      background: none;
      color: var(--brand);
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px
    }

    /* content */
    .body {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px
    }

    .body::-webkit-scrollbar {
      width: 0
    }

    h2 {
      font-size: 21.5px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -.02em
    }

    .lead {
      font-size: 14px;
      color: var(--sub);
      margin: -8px 0 0
    }

    .label {
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--faint);
      margin: 6px 0 -6px
    }

    /* cards */
    .card {
      background: var(--raised);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      padding: 14px
    }

    .card h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600
    }

    .card p {
      margin: 4px 0 0;
      font-size: 13.5px;
      color: var(--sub);
      line-height: 1.45
    }

    .hero {
      background: linear-gradient(140deg, var(--brand) 0%, var(--brand-ink) 100%);
      color: #fff;
      border: none;
      border-radius: 18px;
      padding: 17px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      display: block;
      box-shadow: 0 12px 24px -8px rgba(44, 34, 128, .55);
    }

    .hero .h-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .hero .h-ev {
      font-size: 17px;
      font-weight: 700
    }

    .hero .h-amt {
      font-size: 24px;
      font-weight: 700;
      margin: 10px 0 2px;
      letter-spacing: -.02em
    }

    .hero .h-sub {
      font-size: 13.5px;
      opacity: .85
    }

    .hero .chip {
      background: rgba(255, 255, 255, .2);
      border-radius: 99px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600
    }

    /* buttons */
    .btn {
      width: 100%;
      border-radius: 12px;
      padding: 15px;
      font: inherit;
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -.005em;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform .06s ease, box-shadow .12s ease, opacity .15s ease;
    }

    .btn:active {
      transform: scale(.98) translateY(1px)
    }

    .btn.primary {
      background: linear-gradient(180deg, var(--brand) 0%, var(--brand-2) 100%);
      color: #fff;
      border-color: var(--brand-2);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .16) inset, 0 3px 0 var(--brand-2), 0 10px 20px -6px rgba(59, 45, 174, .5);
    }

    .btn.primary:active {
      box-shadow: 0 1px 0 rgba(255, 255, 255, .12) inset, 0 1px 0 var(--brand-2), 0 4px 10px -4px rgba(59, 45, 174, .45);
    }

    .btn.ghost {
      background: var(--surface);
      color: var(--ink);
      border-color: var(--line-strong);
      box-shadow: 0 1px 0 rgba(18, 17, 31, .04), 0 2px 6px rgba(18, 17, 31, .05);
    }

    .btn.quiet {
      background: none;
      color: var(--sub);
      border: none;
      font-weight: 600;
      font-size: 13.5px;
      padding: 8px
    }

    .btn.danger {
      background: var(--bad-soft);
      color: var(--bad-2);
      border-color: rgba(196, 40, 28, .28)
    }

    .btn[disabled] {
      opacity: .45;
      cursor: not-allowed
    }

    .btn.primary[disabled] {
      background: var(--line);
      color: var(--faint);
      border-color: var(--line-strong);
      box-shadow: none
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    /* list rows */
    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      padding: 13px 14px;
      cursor: pointer;
      font: inherit;
      color: inherit;
      text-align: left;
      box-shadow: 0 1px 0 rgba(18, 17, 31, .03);
      transition: transform .06s ease;
    }

    .row:active {
      background: var(--raised);
      transform: scale(.99)
    }

    .row .r-main {
      flex: 1;
      min-width: 0
    }

    .row .r-t {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .row .r-s {
      font-size: 13px;
      color: var(--sub);
      margin-top: 3px
    }

    .chev {
      color: var(--faint);
      font-size: 17px
    }

    /* pills */
    .pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 99px;
      white-space: nowrap;
      letter-spacing: .01em
    }

    .p-review {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .p-approved {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .p-returned {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .p-notsent {
      background: var(--warn-soft);
      color: var(--warn)
    }

    .p-draft {
      background: var(--raised);
      color: var(--sub)
    }

    /* forms */
    .field label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      margin-bottom: 6px
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1.5px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 16px;
    }

    .field textarea {
      min-height: 82px;
      resize: vertical
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      outline: 2px solid var(--brand);
      outline-offset: -1px;
      border-color: transparent
    }

    .field .hint {
      font-size: 12px;
      color: var(--faint);
      margin-top: 6px
    }

    .field.bad input,
    .field.bad textarea,
    .field.bad .drop {
      border-color: var(--bad)
    }

    .err {
      font-size: 12px;
      color: var(--bad);
      margin-top: 6px;
      font-weight: 600
    }

    .drop {
      border: 1.5px dashed var(--line-strong);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      display: block;
      background: var(--surface);
    }

    .drop .d-t {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--brand)
    }

    .drop .d-s {
      font-size: 12px;
      color: var(--faint);
      margin-top: 4px
    }

    .drop.filled {
      border-style: solid;
      border-color: var(--ok);
      background: var(--ok-soft)
    }

    .drop.filled .d-t {
      color: var(--ok)
    }

    input[type=file] {
      display: none
    }

    .checkline {
      display: flex;
      gap: 11px;
      align-items: flex-start;
      padding: 11px 12px;
      border: 1.5px solid var(--line-strong);
      border-radius: 12px;
      background: var(--surface);
      cursor: pointer;
      font-size: 14px
    }

    .checkline input {
      accent-color: var(--brand);
      width: 17px;
      height: 17px;
      margin: 1px 0 0;
      flex: 0 0 auto
    }

    .banner {
      border-radius: var(--r);
      padding: 13px 14px;
      font-size: 14px;
      line-height: 1.45
    }

    .banner.bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    .banner.info {
      background: var(--brand-soft);
      color: var(--brand-ink)
    }

    .banner strong {
      display: block;
      font-size: 14.5px;
      margin-bottom: 2px
    }

    /* summary + steps */
    .sum {
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden
    }

    .sum div {
      display: flex;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 14.5px
    }

    .sum div:last-child {
      border-bottom: none
    }

    .sum span {
      width: 88px;
      color: var(--sub);
      flex: 0 0 auto;
      font-size: 13px
    }

    .sum b {
      font-weight: 600;
      word-break: break-word
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .step {
      display: flex;
      gap: 12px;
      padding: 2px 0
    }

    .dot {
      width: 16px;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .dot i {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2px solid var(--line);
      margin-top: 3px;
      display: block
    }

    .dot u {
      flex: 1;
      width: 2px;
      background: var(--line);
      margin: 3px 0
    }

    .step.done .dot i {
      background: var(--ok);
      border-color: var(--ok)
    }

    .step.now .dot i {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-soft)
    }

    .step .s-t {
      font-size: 14.5px;
      font-weight: 600;
      padding-bottom: 14px
    }

    .step.next .s-t {
      color: var(--faint);
      font-weight: 500
    }

    .step .s-s {
      display: block;
      font-size: 12px;
      color: var(--sub);
      font-weight: 500;
      margin-top: 2px
    }

    /* sending */
    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center
    }

    .bar {
      width: 180px;
      height: 6px;
      border-radius: 99px;
      background: var(--line);
      overflow: hidden
    }

    .bar i {
      display: block;
      height: 100%;
      width: 40%;
      background: var(--brand);
      border-radius: 99px;
      animation: slide 1.1s ease-in-out infinite
    }

    @keyframes slide {
      0% {
        margin-left: -40%
      }

      100% {
        margin-left: 100%
      }
    }

    .badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 26px
    }

    .badge.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .badge.bad {
      background: var(--bad-soft);
      color: var(--bad)
    }

    /* tabs */
    .tabs {
      display: flex;
      border-top: 1px solid var(--line);
      background: var(--surface);
      flex: 0 0 auto;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      justify-content: space-around;
    }

    .tabs button {
      flex: 1;
      border: none;
      background: none;
      padding: 10px 0 12px;
      cursor: pointer;
      color: var(--faint);
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: transform 0.1s ease;
    }

    .tabs button:active {
      transform: scale(0.95);
    }

    .tabs button .ic {
      font-size: 19px;
      line-height: 1;
      padding: 5px 16px;
      border-radius: 20px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .tabs button.on .ic {
      background: var(--brand-soft);
      color: var(--brand-ink);
    }

    .tabs button.on {
      color: var(--brand-ink);
    }

    /* toast */
    .toast {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 88px;
      background: var(--ink);
      color: var(--surface);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(8px);
      transition: .2s ease;
      pointer-events: none;
      z-index: 9;
    }

    .toast.show {
      opacity: 1;
      transform: none
    }

    /* ---- hidden session log (Ctrl/Cmd + Shift + L, or triple-click the background) ---- */
    .panel {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 400px;
      z-index: 999;
      display: none;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 20px 60px rgba(18, 22, 40, .22);
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - 40px);
    }

    .panel.open {
      display: flex
    }

    .panel h2 {
      font-size: 14px;
      font-weight: 700;
      margin: 0
    }

    .panel .sm {
      font-size: 11.5px;
      color: var(--sub);
      margin: 0
    }

    .panel .r {
      display: flex;
      gap: 8px
    }

    .panel input {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      font: inherit;
      font-size: 13px;
      background: var(--surface);
      color: var(--ink)
    }

    .pbtn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 9px;
      padding: 9px 10px;
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      flex: 1
    }

    .pbtn.go {
      background: var(--brand);
      color: #fff;
      border-color: transparent
    }

    .logwrap {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--raised);
      min-height: 200px
    }

    .logrow {
      display: flex;
      gap: 8px;
      padding: 6px 9px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      align-items: baseline
    }

    .logrow:last-child {
      border-bottom: none
    }

    .logrow .t {
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      flex: 0 0 42px
    }

    .logrow .k {
      font-weight: 700;
      flex: 0 0 52px;
      text-transform: uppercase;
      font-size: 9.5px;
      letter-spacing: .04em
    }

    .logrow .d {
      flex: 1;
      word-break: break-word
    }

    .k.tap {
      color: var(--brand)
    }

    .k.screen {
      color: var(--sub)
    }

    .k.field {
      color: var(--warn)
    }

    .k.note {
      color: var(--ink)
    }

    .k.error {
      color: var(--bad)
    }

    .k.session {
      color: var(--ok)
    }

    .counts {
      display: flex;
      gap: 12px;
      font-size: 11.5px;
      color: var(--sub)
    }

    .counts b {
      color: var(--ink)
    }

    /* ---- v3 additions: dashboard, reimbursements, profile & help ---- */
    .body > * {
      flex-shrink: 0
    }

    .dash {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      text-align: left;
      background: var(--raised);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      padding: 12px 13px 13px;
      font: inherit;
      color: inherit;
      cursor: pointer;
      min-height: 96px;
      box-shadow: 0 1px 0 rgba(18, 17, 31, .03);
      transition: transform .06s ease;
    }

    .tile:active {
      background: var(--line)
    }

    .tile .t-l {
      font-size: 13px;
      font-weight: 600;
      color: var(--sub)
    }

    .tile .t-n {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -.02em;
      margin-top: 4px
    }

    .tile .t-n.bad {
      color: var(--bad)
    }

    .tile .t-n.warn {
      color: var(--warn)
    }

    .tile .t-n.brand {
      color: var(--brand)
    }

    .tile .t-s {
      font-size: 12.5px;
      color: var(--sub);
      line-height: 1.35
    }

    .tabs button .ic {
      position: relative
    }

    .cnt {
      position: absolute;
      top: -3px;
      right: 6px;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 8px;
      background: var(--bad);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      line-height: 16px;
      text-align: center;
    }

    .seg {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: var(--raised);
      border: 1.5px solid var(--line-strong);
      border-radius: 12px;
      padding: 4px
    }

    .seg button {
      border: none;
      background: none;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--sub);
      padding: 10px 6px;
      border-radius: 9px;
      cursor: pointer
    }

    .seg button.on {
      background: var(--surface);
      color: var(--brand-ink);
      box-shadow: 0 1px 3px rgba(18, 22, 40, .14)
    }

    .banner.ok {
      background: var(--ok-soft);
      color: var(--ok)
    }

    .pcard {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      padding: 14px;
      box-shadow: 0 1px 0 rgba(18, 17, 31, .03);
    }

    .me {
      display: flex;
      gap: 14px;
      align-items: center
    }

    .me-body {
      flex: 1;
      min-width: 0
    }

    .pinfo {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid var(--line)
    }

    .pinfo div {
      display: flex;
      gap: 12px;
      padding: 7px 0;
      font-size: 14.5px
    }

    .pinfo span {
      width: 84px;
      color: var(--sub);
      flex: 0 0 auto;
      font-size: 13px
    }

    .pinfo b {
      font-weight: 600;
      word-break: break-word
    }

    .glist {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r);
      overflow: hidden
    }

    .glist>.row {
      border: none;
      border-radius: 0;
      box-shadow: none;
      background: transparent
    }

    .glist>.row+.row {
      border-top: 1px solid var(--line)
    }

    .glist>.checkline {
      border: none;
      border-radius: 0;
      background: transparent
    }

    .glist>.checkline+.checkline {
      border-top: 1px solid var(--line)
    }

    .faq.glist {
      gap: 0
    }

    .glist>details {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0 14px
    }

    .glist>details+details {
      border-top: 1px solid var(--line)
    }

    .faq.glist>details {
      background: transparent;
      border: none;
      border-radius: 0
    }

    .faq.glist>details+details {
      border-top: 1px solid var(--line)
    }

    .av {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--brand-soft);
      color: var(--brand-ink);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
      flex: 0 0 auto
    }

    .me-n {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.01em
    }

    .me-r {
      font-size: 13.5px;
      color: var(--sub);
      margin-top: 2px
    }

    .faq {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .faq details {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0 14px
    }

    .faq summary {
      list-style: none;
      cursor: pointer;
      padding: 13px 0;
      font-size: 14.5px;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      gap: 10px
    }

    .faq summary::-webkit-details-marker {
      display: none
    }

    .faq summary::after {
      content: "+";
      color: var(--faint);
      font-weight: 500
    }

    .faq details[open] summary::after {
      content: "–"
    }

    .faq details p {
      margin: 0 0 13px;
      font-size: 13.5px;
      color: var(--sub);
      line-height: 1.5
    }

    .rules {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--raised);
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .rules li {
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      line-height: 1.45
    }

    .rules li:last-child {
      border-bottom: none
    }

    .rules li::before {
      content: "✓";
      color: var(--ok);
      font-weight: 700
    }

    .billcard .linkbtn {
      padding: 8px 0 0;
      font-size: 14px
    }

    :focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px
    }
    @media (max-width:560px) {
      .outer-ctl {
        display: none !important
      }
    }
  </style>
</head>

<body>
  <div class="fit" id="fit">
    <div class="phone">
      <div class="screen">
        <div class="device" id="device">
          <div class="island"></div>
          <div class="status">
            <span id="clock">9:41</span>
            <span class="right">
              <span class="bars"><i></i><i></i><i></i><i></i></span>
              <span class="wifi">◗</span>
              <span class="batt"><i></i></span>
            </span>
          </div>
          <div id="app"></div>
          <div class="homebar"></div>
          <div class="toast" id="toast"></div>
        </div>
      </div>
    </div>
  </div>

  <button onclick="history.back()" class="iconbtn outer-ctl" aria-label="Browser back"
    style="position:absolute; top:16px; left:16px; z-index:1000; box-shadow:var(--shadow); width:44px; height:44px; font-size:20px;">‹</button>
  <button onclick="document.getElementById('dl-json').click()" class="btn ghost outer-ctl"
    style="position:absolute; top:16px; right:16px; z-index:1000; width:auto; padding:10px 16px; box-shadow:var(--shadow); background:var(--surface)">Download
    Logs (JSON)</button>

  <div class="panel" id="panel">
    <div>
      <h2>Session log</h2>
      <p class="sm">Recording automatically. Ctrl/Cmd + Shift + L hides this again.</p>
    </div>
    <div class="r"><input id="pid" placeholder="Participant label (optional)"></div>
    <div class="counts">
      <span>Entries <b id="n-all">0</b></span>
      <span>Sessions <b id="n-ses">0</b></span>
      <span>This session <b id="n-now">0</b></span>
    </div>
    <div class="logwrap" id="logwrap"></div>
    <div class="r">
      <button class="pbtn go" id="dl-json">JSON</button>
      <button class="pbtn go" id="dl-csv">CSV</button>
      <button class="pbtn" id="clear">Clear</button>
    </div>
  </div>

  <script>
    /* ---------------- data ---------------- */
    const doneStages = (sent, opened, branch) => [
      { t: 'Submitted', s: sent, st: 'done' },
      { t: 'Admin Office opened it', s: opened, st: 'done' },
      { t: 'Bangalore Branch reviewed', s: branch, st: 'done' },
      { t: 'Approved', s: branch, st: 'done' }
    ];

    const seed = () => ({
      failNext: false,
      queryNext: false,
      tab: 'home',
      view: { name: 'home' },
      draft: null, bill: null, rform: null, refile: null, prof: null,
      profile: {
        name: 'Ayush Choudhury', first: 'Ayush', initials: 'AC',
        role: 'Treasurer, Student Council', term: '2026–27',
        email: 'ayush.c@college.edu.in', phone: '+91 98200 41736',
        upi: 'ayush.c@okaxis', bank: 'HDFC Bank, a/c ending 4821', payout: 'upi'
      },
      feed: [
        { t: 'Annual Fest moved to Bangalore Branch', s: '2 Oct', act: 'open', id: 'r1' },
        { t: 'Robotics Workshop bill was queried', s: '19 Sep', act: 'reimb', id: 'b3' }
      ],
      requests: [
        {
          id: 'r1', name: 'Annual Fest', amount: 1000000, date: '2026-10-29', purpose: 'Stage, sound and lighting for the two-day fest', file: 'annual-fest-quote.pdf',
          status: 'review', holder: 'Bangalore Branch', opened: true, sentOn: '28 Sep',
          stages: [{ t: 'Submitted', s: '28 Sep', st: 'done' }, { t: 'Admin Office opened it', s: '30 Sep', st: 'done' }, { t: 'Bangalore Branch reviewing', s: 'Since 2 Oct', st: 'now' }, { t: 'Decision', s: 'Not started', st: 'next' }]
        },
        {
          id: 'r2', name: 'Sports Day', amount: 18000, date: '2026-09-26', purpose: 'Refreshments and medals', file: 'sports-quote.jpg',
          status: 'returned', holder: 'You', opened: true, sentOn: '20 Sep', reason: 'Amount does not match the quotation', reasonSub: 'The quotation totals ₹16,200, the request asks for ₹18,000', by: 'Bangalore Branch, 3 Oct',
          fixes: ['Attach a quotation for the full amount', 'Or lower the request to ₹16,200'],
          stages: [{ t: 'Submitted', s: '20 Sep', st: 'done' }, { t: 'Admin Office opened it', s: '22 Sep', st: 'done' }, { t: 'Returned to you', s: '3 Oct', st: 'now' }]
        },
        {
          id: 'r3', name: 'Orientation Snacks', amount: 6500, date: '2026-09-12', purpose: 'Snacks for 120 first-year students', file: 'sharma-quote.pdf',
          status: 'approved', holder: '—', opened: true, sentOn: '4 Sep', eventDone: false,
          stages: doneStages('4 Sep', '6 Sep', '10 Sep')
        },
        {
          id: 'r4', name: 'Tech Fest', amount: 22000, date: '2026-11-14', purpose: 'Speaker travel and hosting', file: null,
          status: 'draft', holder: 'You', opened: false, stages: []
        },
        {
          id: 'r5', name: 'Cultural Night', amount: 30000, date: '2026-10-04', purpose: 'Costumes and backdrop', file: 'cultural-quote.pdf',
          status: 'notsent', holder: 'You', opened: false, stages: []
        },
        {
          id: 'r6', name: 'Freshers Welcome', amount: 4200, date: '2026-08-22', purpose: 'Sweets and decorations', file: 'kalyan-quote.pdf',
          status: 'approved', holder: '—', opened: true, sentOn: '5 Aug', eventDone: true,
          stages: doneStages('5 Aug', '7 Aug', '12 Aug')
        },
        {
          id: 'r7', name: 'Blood Donation Camp', amount: 3000, date: '2026-08-06', purpose: 'Juice and snacks for donors', file: 'apollo-quote.pdf',
          status: 'approved', holder: '—', opened: true, sentOn: '20 Jul', eventDone: true,
          stages: doneStages('20 Jul', '22 Jul', '28 Jul')
        },
        {
          id: 'r8', name: 'Robotics Workshop', amount: 8400, date: '2026-09-14', purpose: 'Kits and stationery for 40 students', file: 'om-quote.pdf',
          status: 'approved', holder: '—', opened: true, sentOn: '25 Aug', eventDone: true,
          stages: doneStages('25 Aug', '27 Aug', '2 Sep')
        }
      ],
      bills: [
        {
          id: 'b1', rid: 'r6', event: 'Freshers Welcome', vendor: 'Kalyan Sweets', amount: 4200, on: '24 Aug', photo: 'kalyan-sweets-bill.jpg',
          reimb: {
            status: 'processing', amount: 4200, payTo: 'UPI ayush.c@okaxis', requested: '24 Aug', holder: 'Bangalore Branch',
            stages: [
              { t: 'Reimbursement requested', s: '24 Aug', st: 'done' },
              { k: 'verify', t: 'Admin Office verified the bill', s: '27 Aug', st: 'done' },
              { k: 'release', t: 'Bangalore Branch releasing payment', s: 'Since 29 Aug', st: 'now' },
              { k: 'paid', t: 'Paid to you', s: 'Not started', st: 'next' }]
          }
        },
        {
          id: 'b2', rid: 'r7', event: 'Blood Donation Camp', vendor: 'Apollo Refreshments', amount: 3000, on: '8 Aug', photo: 'apollo-bill.pdf',
          reimb: {
            status: 'paid', amount: 3000, payTo: 'UPI ayush.c@okaxis', requested: '8 Aug', holder: '—', paidOn: '14 Aug', utr: '4127 8830 1942',
            stages: [
              { t: 'Reimbursement requested', s: '8 Aug', st: 'done' },
              { k: 'verify', t: 'Admin Office verified the bill', s: '10 Aug', st: 'done' },
              { k: 'release', t: 'Bangalore Branch released payment', s: '13 Aug', st: 'done' },
              { k: 'paid', t: 'Paid to you', s: '14 Aug', st: 'done' }]
          }
        },
        {
          id: 'b3', rid: 'r8', event: 'Robotics Workshop', vendor: 'Om Stationers', amount: 8400, on: '16 Sep', photo: 'om-stationers-bill.jpg',
          reimb: {
            status: 'queried', amount: 8400, payTo: 'UPI ayush.c@okaxis', requested: '16 Sep', holder: 'You',
            reason: 'The bill has no GST number', reasonSub: 'Bills above ₹5,000 must show the vendor’s GSTIN.', by: 'Admin Office, 19 Sep',
            fixes: ['Ask Om Stationers for a GST bill', 'Upload the new bill here and resend'],
            stages: [
              { t: 'Reimbursement requested', s: '16 Sep', st: 'done' },
              { k: 'verify', t: 'Admin Office queried the bill', s: '19 Sep', st: 'now' },
              { k: 'release', t: 'Bangalore Branch releasing payment', s: 'Not started', st: 'next' },
              { k: 'paid', t: 'Paid to you', s: 'Not started', st: 'next' }]
          }
        }
      ]
    });
    let S = seed();

    const META = {
      draft: { label: 'Draft', cls: 'p-draft', say: 'You saved it. Nothing has been sent.' },
      notsent: { label: 'Not sent', cls: 'p-notsent', say: 'The send failed. Nothing reached the Admin Office.' },
      review: { label: 'In review', cls: 'p-review', say: 'Someone has it. The screen names who.' },
      returned: { label: 'Returned', cls: 'p-returned', say: 'Sent back with a reason. Edit and resubmit.' },
      approved: { label: 'Approved', cls: 'p-approved', say: 'Money cleared. Upload the bill after the event.' },
      withdrawn: { label: 'Withdrawn', cls: 'p-draft', say: 'You pulled it back before it was opened.' }
    };
    const RMETA = {
      verifying: { label: 'Verifying', cls: 'p-review', say: 'The Admin Office is checking your bill against the approved amount.' },
      processing: { label: 'Processing', cls: 'p-review', say: 'Bill verified. The Bangalore Branch is releasing the money.' },
      queried: { label: 'Queried', cls: 'p-returned', say: 'Sent back with a reason. Fix the bill and resend. Not a rejection.' },
      paid: { label: 'Paid', cls: 'p-approved', say: 'The money has been sent to your account.' }
    };

    /* ---------------- helpers ---------------- */
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    const req = id => S.requests.find(r => r.id === id);
    const billById = id => S.bills.find(b => b.id === id);
    const billFor = rid => S.bills.find(b => b.rid === rid);
    const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

    function inr(n) {
      const x = Math.round(Number(n) || 0), s = String(x), last = s.slice(-3), rest = s.slice(0, -3);
      return '₹' + (rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' : '') + last;
    }
    function nice(d) {
      if (!d) return '—';
      const p = d.split('-'); if (p.length !== 3) return d;
      const m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return Number(p[2]) + ' ' + m[Number(p[1]) - 1] + ' ' + p[0];
    }
    function today() {
      const d = new Date(), m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return d.getDate() + ' ' + m[d.getMonth()];
    }
    function go(name, arg) { S.view = { name: name, arg: arg }; render(); const b = $('body'); if (b) b.scrollTop = 0; }
    let toastT;
    function toast(msg) {
      const t = $('toast'); t.textContent = msg; t.classList.add('show');
      clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
    }
    const pill = s => '<span class="pill ' + META[s].cls + '">' + META[s].label + '</span>';
    const rpill = s => '<span class="pill ' + RMETA[s].cls + '">' + RMETA[s].label + '</span>';
    const payoutLabel = (p, which) => ((which || p.payout) === 'upi' ? 'UPI ' + p.upi : p.bank);

    // views that can safely re-render while a live timer fires (no half-typed forms)
    const LIVE = ['home', 'requests', 'bills', 'track', 'submitted', 'reimb', 'billdone', 'profile'];
    function refresh() { if (LIVE.includes(S.view.name)) render(); }
    function pushFeed(t, act, id) { S.feed.unshift({ t: t, s: 'Today', act: act, id: id }); }

    function counts() {
      const billed = S.bills.map(b => b.rid);
      const reqNeeds = S.requests.filter(r => r.status === 'returned' || r.status === 'notsent');
      const inReview = S.requests.filter(r => r.status === 'review');
      const due = S.requests.filter(r => r.status === 'approved' && r.eventDone && billed.indexOf(r.id) === -1);
      const queried = S.bills.filter(b => b.reimb && b.reimb.status === 'queried');
      const owed = S.bills.filter(b => b.reimb && b.reimb.status !== 'paid');
      return { reqNeeds, inReview, due, queried, owed, owedAmt: owed.reduce((a, b) => a + b.reimb.amount, 0) };
    }

    function shell(title, bodyHtml, o) {
      o = o || {};
      const back = o.back ? '<button class="iconbtn" aria-label="Back" data-act="go" data-to="' + o.back + '" data-arg="' + (o.backArg || '') + '">‹</button>' : '';
      const right = o.right ? '<button class="linkbtn" data-act="' + o.right.act + '">' + o.right.label + '</button>' : '';
      const tabs = o.hideTabs ? '' : tabBar();
      return '<div class="top">' + back + '<h1>' + esc(title) + '</h1>' + right + '</div>' +
        '<div class="body" id="body">' + bodyHtml + '</div>' + tabs;
    }
    function tabBar() {
      const c = counts();
      const badge = { requests: c.reqNeeds.length, bills: c.due.length + c.queried.length };
      const t = [['home', '⌂', 'Home'], ['requests', '▤', 'Requests'], ['bills', '₹', 'Bills'], ['profile', '◉', 'Profile & help']];
      return '<div class="tabs">' + t.map(x =>
        '<button class="' + (S.tab === x[0] ? 'on' : '') + '" data-act="tab" data-to="' + x[0] + '">' +
        '<span class="ic">' + x[1] + (badge[x[0]] ? '<b class="cnt">' + badge[x[0]] + '</b>' : '') + '</span>' + x[2] + '</button>').join('') + '</div>';
    }
    function rowHtml(r) {
      let approvedSub = r.eventDone ? 'Event done — bill due' : 'Approved — mark done after the event';
      const b = billFor(r.id);
      if (b) approvedSub = b.reimb ? 'Reimbursement ' + RMETA[b.reimb.status].label.toLowerCase() : 'Bill uploaded';
      const sub = {
        draft: 'Saved, never sent',
        notsent: 'The send failed — try again',
        review: 'With ' + r.holder,
        returned: 'Needs changes from you',
        approved: approvedSub,
        withdrawn: 'Pulled back — edit to send again'
      }[r.status];
      return '<button class="row" data-act="open" data-id="' + r.id + '">' +
        '<div class="r-main"><div class="r-t">' + esc(r.name) + '</div>' +
        '<div class="r-s">' + inr(r.amount) + ' · ' + sub + '</div></div>' +
        pill(r.status) + '<span class="chev">›</span></button>';
    }
    function reimbRow(b) {
      const m = b.reimb;
      const sub = {
        verifying: 'Admin Office checking the bill',
        processing: 'With ' + m.holder,
        queried: 'Needs a corrected bill',
        paid: 'Paid ' + (m.paidOn || '')
      }[m.status];
      return '<button class="row" data-act="reimb" data-id="' + b.id + '">' +
        '<div class="r-main"><div class="r-t">' + esc(b.event) + '</div>' +
        '<div class="r-s">' + inr(m.amount) + ' · ' + esc(sub) + '</div></div>' +
        rpill(m.status) + '<span class="chev">›</span></button>';
    }
    function stepsHtml(stages) {
      return '<div class="steps">' + stages.map((s, i) =>
        '<div class="step ' + s.st + '"><div class="dot"><i></i>' + (i < stages.length - 1 ? '<u></u>' : '') + '</div>' +
        '<div class="s-t">' + esc(s.t) + '<span class="s-s">' + esc(s.s) + '</span></div></div>').join('') + '</div>';
    }

    /* ---------------- screens ---------------- */
    const V = {};

    V.home = () => {
      const c = counts(), p = S.profile;
      const needs = c.reqNeeds.length + c.due.length + c.queried.length;
      const billIssues = c.due.length + c.queried.length;
      const needsSub = needs
        ? [c.reqNeeds.length ? plural(c.reqNeeds.length, 'request') : '', billIssues ? plural(billIssues, 'bill') : ''].filter(Boolean).join(', ')
        : 'All clear';
      const reviewSub = c.inReview.length === 1 ? 'With ' + c.inReview[0].holder : (c.inReview.length ? 'Moving through approval' : 'Nothing sent right now');
      const tile = (lbl, n, sub, to, tone) =>

    };

    V.billdone = () => {
      const b = billById(S.view.arg) || S.bills[S.bills.length - 1];
      const m = b.reimb;
      let h = '<div class="center" style="flex:0 0 auto;align-items:flex-start;text-align:left">' +
        '<div class="badge ok">✓</div><h2>' + (m ? 'Bill received, reimbursement requested' : 'Bill received') + '</h2>' +
        '<p class="lead">' + inr(b.amount) + ' · ' + esc(b.vendor) + '</p></div>';
      if (m) {
        h += '<div class="card"><h3>Paying back to ' + esc(m.payTo) + '</h3><p>Live demo: each step moves every 10 seconds.</p></div>';
        h += '<p class="label">Progress</p>' + stepsHtml(m.stages);
        h += '<div class="actions"><button class="btn primary" data-act="reimb" data-id="' + b.id + '">Track reimbursement</button>' +
          '<button class="btn ghost" data-act="tab" data-to="home">Go home</button></div>';
      } else {
        h += '<div class="card"><h3>No paper copy needed</h3><p>The Admin Office can see this bill now.</p></div>';
        h += '<p class="label">Progress</p>' + stepsHtml([
          { t: 'Uploaded', s: 'Just now', st: 'done' },
          { t: 'Admin Office check', s: 'Not started · usually 2 days', st: 'next' }]);
        h += '<div class="actions"><button class="btn primary" data-act="tab" data-to="home">Go home</button>' +
          '<button class="btn ghost" data-act="reimbfor" data-id="' + b.id + '">I paid this myself — request reimbursement</button></div>';
      }
      return shell('Uploaded', h, { hideTabs: true });
    };

    /* request reimbursement for a bill that is already uploaded */
    V.reimbform = () => {
      const f = S.rform, b = billById(f.bid), p = S.profile;
      let h = '<div class="sum"><div><span>Event</span><b>' + esc(b.event) + '</b></div>' +
        '<div><span>Vendor</span><b>' + esc(b.vendor) + '</b></div>' +
        '<div><span>Amount</span><b>' + inr(b.amount) + '</b></div>' +
        '<div><span>Bill</span><b>' + esc(b.photo || 'Uploaded ' + b.on) + '</b></div></div>';
      h += '<div class="field"><label>Pay me back by</label><div class="seg">' +
        '<button class="' + (f.payout === 'upi' ? 'on' : '') + '" data-act="rfpay" data-to="upi">UPI</button>' +
        '<button class="' + (f.payout === 'bank' ? 'on' : '') + '" data-act="rfpay" data-to="bank">Bank transfer</button></div>' +
        '<div class="hint">To ' + esc(payoutLabel(p, f.payout)) + '</div></div>';
      h += '<label class="checkline"><input type="checkbox" data-check-rf="c"' + (f.c ? ' checked' : '') +
        '><span>I paid ' + esc(b.vendor) + ' from my own money and have not been paid back</span></label>';
      h += '<button class="btn primary" data-act="reimbsubmit" ' + (f.c ? '' : 'disabled') + '>Request reimbursement</button>';
      h += '<p class="lead" style="text-align:center">The Admin Office verifies the bill, then the Bangalore Branch pays you.</p>';
      return shell('Request reimbursement', h, { right: { act: 'cancel', label: 'Cancel' }, hideTabs: true });
    };

    /* reimbursement status */
    V.reimb = () => {
      const b = billById(S.view.arg);
      if (!b || !b.reimb) return V.bills();
      const m = b.reimb;
      let h = '<h2>' + inr(m.amount) + '</h2><p class="lead">' + esc(b.event) + ' · ' + esc(b.vendor) + '</p>';
      if (m.status === 'queried') {
        h += '<div class="banner bad"><strong>Queried, not rejected</strong>By ' + esc(m.by) + '</div>';
        h += '<div class="card"><h3>' + esc(m.reason) + '</h3><p>' + esc(m.reasonSub) + '</p></div>';
        h += '<p class="label">To fix</p>' + m.fixes.map(x =>
          '<label class="checkline"><input type="checkbox"><span>' + esc(x) + '</span></label>').join('');
      } else if (m.status === 'paid') {
        h += '<div class="banner ok"><strong>Paid to you on ' + esc(m.paidOn) + '</strong>Sent to ' + esc(m.payTo) + '</div>';
        h += '<div class="card"><h3>Payment reference</h3><p>UTR ' + esc(m.utr) + '. Show this to your bank if the money has not arrived in 24 hours.</p></div>';
      } else {
        h += '<div class="card"><h3>Now with: ' + esc(m.holder) + '</h3><p>' +
          (m.status === 'verifying' ? 'Checking the bill against the approved amount. Nothing needed from you.'
            : 'Releasing the payment to your account. Nothing needed from you.') + '</p></div>';
      }
      h += '<div class="sum"><div><span>Paying to</span><b>' + esc(m.payTo) + '</b></div>' +
        '<div><span>Requested</span><b>' + esc(m.requested) + '</b></div>' +
        '<div><span>Bill</span><b>' + esc(b.photo || '—') + '</b></div></div>';
      h += '<p class="label">Progress</p>' + stepsHtml(m.stages);
      if (m.status === 'queried') {
        h += '<div class="actions"><button class="btn primary" data-act="refile" data-id="' + b.id + '">Upload a corrected bill</button>' +
          '<button class="btn ghost" data-act="go" data-to="rules" data-arg="bills">See bill rules</button></div>';
      }
      return shell('Reimbursement', h, { back: 'tab', backArg: 'bills', hideTabs: true });
    };

    V.refile = () => {
      const f = S.refile, b = billById(f.bid);
      const ready = f.photo && f.c;
      let h = '<div class="banner info"><strong>Only the bill changes</strong>Your request keeps its place. The Admin Office checks the new bill next.</div>';
      h += '<div class="card"><h3>Queried for</h3><p>' + esc(b.reimb.reason) + '</p></div>';
      h += '<div class="field"><label>Corrected bill</label>' +
        '<label class="drop ' + (f.photo ? 'filled' : '') + '" for="i-rf"><div class="d-t">' +
        (f.photo ? '✓ ' + esc(f.photo) : '+ Add the new bill') + '</div><div class="d-s">' +
        (f.photo ? 'Tap to replace' : 'JPG or PDF, max 5 MB') + '</div></label>' +
        '<input id="i-rf" type="file" accept="image/*,.pdf" data-file="refile"></div>';
      h += '<label class="checkline"><input type="checkbox" data-check-refile="c"' + (f.c ? ' checked' : '') +
        '><span>The new bill fixes the problem above</span></label>';
      h += '<button class="btn primary" data-act="resend" ' + (ready ? '' : 'disabled') + '>Resend for verification</button>';
      return shell('Fix the bill', h, { right: { act: 'cancel', label: 'Cancel' }, hideTabs: true });
    };

    /* ---------------- render + actions ---------------- */
    let rendering = false;
    function render() {
      // removing a focused input fires blur/change mid-render; queue that render instead of nesting it
      if (rendering) { setTimeout(render, 0); return; }
      rendering = true;
      try {
        const fn = V[S.view.name] || V.home;
        $('app').innerHTML = fn();
      } finally { rendering = false; }
    }

    function openRequest(id) {
      const r = req(id);
      if (r.status === 'returned') return go('returned', id);
      if (r.status === 'approved') return go('approved', id);
      if (r.status === 'review') return go('track', id);
      return go('draftview', id);
    }

    function newDraft(from) {
      S.draft = from
        ? { id: from.id, name: from.name, amount: String(from.amount), date: from.date, purpose: from.purpose, file: from.file, errors: {} }
        : { id: null, name: '', amount: '', date: '', purpose: '', file: null, errors: {} };
      go('form');
    }

    function validate() {
      const d = S.draft, e = {};
      if (!d.name.trim()) e.name = 'Enter the event name';
      if (!(Number(d.amount) > 0)) e.amount = 'Enter an amount';
      if (!d.date) e.date = 'Pick the event date';
      if (!d.purpose.trim()) e.purpose = 'Say why the money is needed';
      if (!d.file) e.file = 'Attach at least one quotation';
      d.errors = e;
      return Object.keys(e).length === 0;
    }

    function doSend() {
      go('sending');
      setTimeout(() => {
        if (S.failNext) {
          S.failNext = false;
          const d = S.draft;
          if (d.id) { const r = req(d.id); r.status = 'notsent'; }
          return go('notsent');
        }
        const d = S.draft;
        let r = d.id ? req(d.id) : null;
        if (!r) { r = { id: 'r' + Date.now(), stages: [] }; S.requests.unshift(r); }
        Object.assign(r, {
          name: d.name.trim(), amount: Number(d.amount), date: d.date, purpose: d.purpose.trim(), file: d.file,
          status: 'review', holder: 'Admin Office', opened: false, sentOn: today(),
          stages: [
            { t: 'Submitted', s: today(), st: 'done' },
            { t: 'Admin Office opened it', s: 'Reviewing...', st: 'now' },
            { t: 'Bangalore Branch reviewing', s: 'Not started', st: 'next' },
            { t: 'Decision', s: 'Not started', st: 'next' }
          ]
        });
        S.draft = null;
        pushFeed(r.name + ' sent to the Admin Office', 'open', r.id);
        advance(r);
        go('submitted', r.id);
      }, 1700);
    }

    // the request advances step by step: 10s per approval step, fully approved in 30s
    function advance(r) {
      setTimeout(() => {
        if (r.status !== 'review') return;
        r.opened = true;
        r.holder = 'Bangalore Branch';
        r.stages[1] = { t: 'Admin Office opened it', s: today(), st: 'done' };
        r.stages[2] = { t: 'Bangalore Branch reviewing', s: 'In review', st: 'now' };
        pushFeed(r.name + ' moved to Bangalore Branch', 'open', r.id);
        toast('Admin Office approved & sent to Bangalore Branch');
        logEvent('note', 'Step 1/3 (10s): Admin Office approved', r.name);
        refresh();
      }, 10000);

      setTimeout(() => {
        if (r.status !== 'review') return;
        r.holder = 'Decision Desk';
        r.stages[2] = { t: 'Bangalore Branch reviewed', s: today(), st: 'done' };
        r.stages[3] = { t: 'Decision', s: 'Final sign-off in progress', st: 'now' };
        toast('Bangalore Branch approved — Final decision pending');
        logEvent('note', 'Step 2/3 (20s): Bangalore Branch approved', r.name);
        refresh();
      }, 20000);

      setTimeout(() => {
        if (r.status !== 'review') return;
        r.status = 'approved';
        r.holder = '—';
        r.eventDone = false;
        r.stages[3] = { t: 'Approved', s: today(), st: 'done' };
        pushFeed(r.name + ' approved for ' + inr(r.amount), 'open', r.id);
        toast('🎉 ' + r.name + ' approved (' + inr(r.amount) + ')!');
        logEvent('note', 'Step 3/3 (30s): Fully Approved', r.name);
        if ((S.view.name === 'track' || S.view.name === 'submitted') && S.view.arg === r.id) go('approved', r.id);
        else refresh();
      }, 30000);
    }

    /* reimbursements: verify at 10s, paid at 20s (or queried, if the demo toggle is on) */
    const freshReimbStages = () => [
      { t: 'Reimbursement requested', s: today(), st: 'done' },
      { k: 'verify', t: 'Admin Office verifying the bill', s: 'In progress', st: 'now' },
      { k: 'release', t: 'Bangalore Branch releasing payment', s: 'Not started', st: 'next' },
      { k: 'paid', t: 'Paid to you', s: 'Not started', st: 'next' }];
    function newReimb(amount, payTo) {
      return { status: 'verifying', amount: amount, payTo: payTo, requested: today(), holder: 'Admin Office', stages: freshReimbStages() };
    }
    function setStage(m, k, obj) {
      const i = m.stages.findIndex(s => s.k === k);
      if (i > -1) m.stages[i] = Object.assign({ k: k }, obj);
    }
    function advanceReimb(b) {
      const m = b.reimb, run = m.run = (m.run || 0) + 1;
      setTimeout(() => {
        if (m.run !== run || m.status !== 'verifying') return;
        if (S.queryNext) {
          S.queryNext = false;
          Object.assign(m, {
            status: 'queried', holder: 'You', by: 'Admin Office, ' + today(),
            reason: 'The bill has no GST number', reasonSub: 'Bills above ₹5,000 must show the vendor’s GSTIN.',
            fixes: ['Ask ' + b.vendor + ' for a GST bill', 'Upload the new bill here and resend']
          });
          setStage(m, 'verify', { t: 'Admin Office queried the bill', s: today(), st: 'now' });
          pushFeed(b.event + ' bill was queried', 'reimb', b.id);
          toast('Admin Office queried the ' + b.event + ' bill');
          logEvent('note', 'Reimbursement queried', b.event);
          return refresh();
        }
        m.status = 'processing'; m.holder = 'Bangalore Branch';
        setStage(m, 'verify', { t: 'Admin Office verified the bill', s: today(), st: 'done' });
        setStage(m, 'release', { t: 'Bangalore Branch releasing payment', s: 'In progress', st: 'now' });
        pushFeed(b.event + ' bill verified, payment on its way', 'reimb', b.id);
        toast('Bill verified — Bangalore Branch is releasing ' + inr(m.amount));
        logEvent('note', 'Reimbursement 1/2 (10s): verified', b.event);
        refresh();
      }, 10000);
      setTimeout(() => {
        if (m.run !== run || m.status !== 'processing') return;
        m.status = 'paid'; m.holder = '—'; m.paidOn = today();
        m.utr = String(Math.floor(1e11 + Math.random() * 9e11)).replace(/(\d{4})(?=\d)/g, '$1 ');
        setStage(m, 'release', { t: 'Bangalore Branch released payment', s: today(), st: 'done' });
        setStage(m, 'paid', { t: 'Paid to you', s: today(), st: 'done' });
        pushFeed(inr(m.amount) + ' reimbursed for ' + b.event, 'reimb', b.id);
        toast(inr(m.amount) + ' reimbursed to ' + m.payTo);
        logEvent('note', 'Reimbursement 2/2 (20s): paid', b.event);
        refresh();
      }, 20000);
    }

    function startBill(paid, id) {
      const open = S.requests.filter(r => r.status === 'approved' && !billFor(r.id));
      if (!open.length) return false;
      const pick = id && open.some(r => r.id === id) ? id : open[0].id;
      S.bill = { rid: pick, vendor: '', amount: String(req(pick).amount), photo: null, c3: false, paid: paid };
      go('uploadbill');
      return true;
    }
    function startReimbFor(bid) {
      S.rform = { bid: bid, payout: S.profile.payout, c: false };
      go('reimbform');
    }

    document.addEventListener('click', ev => {
      const el = ev.target.closest('[data-act]');
      if (!el) return;
      const act = el.dataset.act, id = el.dataset.id, to = el.dataset.to;
      if (el.type === 'checkbox') return; // handled on change
      if (act === 'tab') { S.tab = to; go(to); return; }
      if (act === 'go') { if (to === 'tab') { S.tab = el.dataset.arg; go(el.dataset.arg); } else go(to, el.dataset.arg); return; }
      if (act === 'open') { openRequest(id); return; }
      if (act === 'reimb') { go('reimb', id); return; }
      if (act === 'new') { newDraft(null); return; }
      if (act === 'edit') { newDraft(req(id)); return; }
      if (act === 'cancel') {
        S.draft = S.bill = S.rform = S.refile = S.prof = null;
        go(S.tab); return;
      }
      if (act === 'form') { go('form'); return; }
      if (act === 'review') {
        if (validate()) go('review');
        else { render(); toast('Check the highlighted fields'); }
        return;
      }
      if (act === 'send') { doSend(); return; }
      if (act === 'savedraft') {
        const d = S.draft;
        let r = d.id ? req(d.id) : null;
        if (!r) { r = { id: 'r' + Date.now(), stages: [] }; S.requests.unshift(r); }
        Object.assign(r, { name: d.name.trim(), amount: Number(d.amount), date: d.date, purpose: d.purpose, file: d.file, status: 'notsent', holder: 'You', opened: false });
        S.draft = null; S.tab = 'home'; go('home'); toast('Saved. Nothing was sent.');
        return;
      }
      if (act === 'withdraw') {
        const r = req(id);
        if (r.opened) { toast('Too late to withdraw — the Admin Office has opened it'); return; }
        r.status = 'withdrawn'; r.holder = 'You'; r.stages = [];
        S.tab = 'home'; go('home'); toast('Withdrawn. Everything you typed is kept.');
        return;
      }
      if (act === 'askchange') { toast('A note went to the Bangalore Branch reviewer'); return; }
      if (act === 'markdone') {
        const r = req(id);
        r.eventDone = true;
        S.tab = 'bills'; go('bills');
        toast('Moved to Bills — upload the receipt when you have it');
        return;
      }
      if (act === 'uploadbill') {
        if (!startBill('college', id)) toast(S.requests.some(r => r.status === 'approved')
          ? 'Every approved request already has a bill' : 'No approved request to bill against yet');
        return;
      }
      if (act === 'reimbnew') {
        if (startBill('me', id)) return;
        const plain = S.bills.find(b => !b.reimb);
        if (plain) { startReimbFor(plain.id); return; }
        toast('Reimbursements need an approved request with a bill');
        return;
      }
      if (act === 'reimbfor') { startReimbFor(id); return; }
      if (act === 'paidby') { S.bill.paid = to; render(); return; }
      if (act === 'rfpay') { S.rform.payout = to; render(); return; }
      if (act === 'reimbsubmit') {
        const f = S.rform, b = billById(f.bid);
        if (!f.c) return;
        b.reimb = newReimb(b.amount, payoutLabel(S.profile, f.payout));
        S.rform = null; S.tab = 'bills';
        pushFeed('Reimbursement requested for ' + b.event, 'reimb', b.id);
        go('sending', 'Sending to Admin Office');
        setTimeout(() => { go('reimb', b.id); toast('Reimbursement requested'); advanceReimb(b); }, 1200);
        return;
      }
      if (act === 'upload') {
        const b = S.bill, r = req(b.rid);
        if (!billReady(b)) return;
        const nb = { id: 'b' + Date.now(), rid: b.rid, event: r.name, vendor: b.vendor.trim(), amount: Number(b.amount), on: today(), photo: b.photo, reimb: null };
        if (b.paid === 'me') nb.reimb = newReimb(nb.amount, payoutLabel(S.profile));
        S.bills.push(nb); r.eventDone = true;
        S.bill = null; S.tab = 'bills';
        pushFeed((nb.reimb ? 'Reimbursement requested for ' : 'Bill uploaded for ') + nb.event, nb.reimb ? 'reimb' : 'open', nb.reimb ? nb.id : nb.rid);
        go('billdone', nb.id);
        if (nb.reimb) advanceReimb(nb);
        return;
      }
      if (act === 'refile') { S.refile = { bid: id, photo: null, c: false }; go('refile'); return; }
      if (act === 'resend') {
        const f = S.refile, b = billById(f.bid), m = b.reimb;
        if (!(f.photo && f.c)) return;
        b.photo = f.photo;
        const queriedOn = m.by ? m.by.split(', ').pop() : today();
        Object.assign(m, { status: 'verifying', holder: 'Admin Office' });
        m.stages = [
          { t: 'Reimbursement requested', s: m.requested, st: 'done' },
          { t: 'Admin Office queried the bill', s: queriedOn, st: 'done' },
          { t: 'Corrected bill sent', s: today(), st: 'done' },
          { k: 'verify', t: 'Admin Office verifying the bill', s: 'In progress', st: 'now' },
          { k: 'release', t: 'Bangalore Branch releasing payment', s: 'Not started', st: 'next' },
          { k: 'paid', t: 'Paid to you', s: 'Not started', st: 'next' }];
        S.refile = null;
        pushFeed('Corrected bill sent for ' + b.event, 'reimb', b.id);
        go('reimb', b.id); toast('Corrected bill sent to the Admin Office');
        advanceReimb(b);
        return;
      }
      if (act === 'editprofile') { S.prof = Object.assign({}, S.profile, { errors: {} }); go('editprofile'); return; }
      if (act === 'profpay') { S.prof.payout = to; render(); return; }
      if (act === 'saveprofile') {
        const p = S.prof, e = {};
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p.email.trim())) e.email = 'Enter an email like name@college.edu.in';
        if (p.phone.replace(/\D/g, '').length < 10) e.phone = 'Enter a 10-digit phone number';
        if (!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(p.upi.trim()) && p.payout === 'upi') e.upi = 'Enter a UPI ID like name@okaxis';
        if (!p.bank.trim() && p.payout === 'bank') e.bank = 'Add the bank account to be paid back to';
        p.errors = e;
        if (Object.keys(e).length) { render(); toast('Check the highlighted fields'); return; }
        delete p.errors;
        ['email', 'phone', 'upi', 'bank'].forEach(k => p[k] = p[k].trim());
        S.profile = p; S.prof = null; S.tab = 'profile';
        go('profile'); toast('Profile saved');
        return;
      }
      if (act === 'reset') { S = seed(); S.tab = 'profile'; go('profile'); toast('Demo data reset'); return; }
      if (act === 'download_logs') { document.getElementById('dl-json').click(); return; }
      if (act === 'clear_logs') { document.getElementById('clear').click(); toast('Logs cleared'); return; }
    });

    document.addEventListener('change', ev => {
      const t = ev.target;
      if (t.dataset.act === 'fail') { S.failNext = t.checked; toast(t.checked ? 'The next request send will fail' : 'Request sends will succeed'); return; }
      if (t.dataset.act === 'query') { S.queryNext = t.checked; toast(t.checked ? 'The next reimbursement will be queried' : 'Reimbursements will go through'); return; }
      if (t.dataset.check) { S.bill[t.dataset.check] = t.checked; render(); return; }
      if (t.dataset.checkRf) { S.rform.c = t.checked; render(); return; }
      if (t.dataset.checkRefile) { S.refile.c = t.checked; render(); return; }
      if (t.dataset.file) {
        const name = t.files && t.files[0] ? t.files[0].name : null;
        if (!name) return;
        if (t.dataset.file === 'draft') { S.draft.file = name; if (S.draft.errors) delete S.draft.errors.file; }
        else if (t.dataset.file === 'refile') { S.refile.photo = name; }
        else { S.bill.photo = name; }
        render();
        return;
      }
      if (t.dataset.bindBill) {
        S.bill[t.dataset.bindBill] = t.value;
        if (t.dataset.bindBill === 'rid') S.bill.amount = String(req(t.value).amount);
        render();
      }
    });

    document.addEventListener('input', ev => {
      const t = ev.target;
      if (t.dataset.bind) { S.draft[t.dataset.bind] = t.value; }
      if (t.dataset.bindProf) { S.prof[t.dataset.bindProf] = t.value; }
      if (t.dataset.bindBill === 'vendor' || t.dataset.bindBill === 'amount') {
        S.bill[t.dataset.bindBill] = t.value;
        const btn = document.querySelector('[data-act="upload"]');
        if (btn) btn.disabled = !billReady(S.bill);
      }
    });

    function clock() {
      const el = $('clock');
      if (!el) return;
      const d = new Date(), h = d.getHours() % 12 || 12;
      el.textContent = h + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    clock(); setInterval(clock, 20000);

    render();

    /* ---------------- silent session logger ---------------- */
    const LOGKEY = 'campusbudget.log.v2';
    const SESSION = 'S' + new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
    const T0 = Date.now();
    let LOG = [];

    try { const raw = localStorage.getItem(LOGKEY); if (raw) LOG = JSON.parse(raw) || []; } catch (e) { LOG = []; }

    const persist = () => { try { localStorage.setItem(LOGKEY, JSON.stringify(LOG)); } catch (e) { } };
    const pid = () => { const el = document.getElementById('pid'); return el && el.value.trim() ? el.value.trim() : ''; };

    function logEvent(kind, detail, extra) {
      const now = Date.now();
      LOG.push({
        n: LOG.length + 1,
        session: SESSION,
        participant: pid(),
        kind: kind,
        detail: detail || '',
        extra: extra || '',
        screen: S.view ? S.view.name : '',
        msIntoSession: now - T0,
        time: new Date(now).toISOString()
      });
      persist();
      paintLog();
    }

    function paintLog() {
      const wrap = document.getElementById('logwrap');
      if (!wrap || !document.getElementById('panel').classList.contains('open')) return;
      const mine = LOG.filter(e => e.session === SESSION);
      wrap.innerHTML = LOG.slice(-80).map(e =>
        '<div class="logrow"><span class="t">' + e.time.slice(14, 19) + '</span>' +
        '<span class="k ' + e.kind + '">' + e.kind + '</span>' +
        '<span class="d">' + esc(e.detail) + (e.extra ? ' — ' + esc(e.extra) : '') + '</span></div>').join('');
      wrap.scrollTop = wrap.scrollHeight;
      document.getElementById('n-all').textContent = LOG.length;
      document.getElementById('n-now').textContent = mine.length;
      document.getElementById('n-ses').textContent = new Set(LOG.map(e => e.session)).size;
    }

    /* automatic capture: screens, taps, typing, validation failures */
    const _go = go;
    go = function (name, arg) { _go(name, arg); logEvent('screen', name + (arg ? ' · ' + arg : '')); };

    const _validate = validate;
    validate = function () {
      const ok = _validate();
      if (!ok) logEvent('error', 'validation: ' + Object.keys(S.draft.errors).join(', '));
      return ok;
    };

    document.addEventListener('click', ev => {
      const el = ev.target.closest('[data-act]');
      if (!el || el.closest('#panel')) return;
      logEvent('tap', [el.dataset.act, el.dataset.id, el.dataset.to].filter(Boolean).join(' · '),
        (el.textContent || '').trim().slice(0, 42));
    }, true);

    document.addEventListener('change', ev => {
      const el = ev.target;
      if (el.closest && el.closest('#panel')) return;
      if (el.dataset && (el.dataset.bind || el.dataset.bindBill))
        logEvent('field', (el.dataset.bind || el.dataset.bindBill) + ' = ' + String(el.value).slice(0, 60));
      if (el.dataset && el.dataset.file) logEvent('field', 'attached a file');
      if (el.dataset && el.dataset.check) logEvent('field', 'check ' + (el.checked ? 'on' : 'off'));
    }, true);

    document.addEventListener('blur', ev => {
      const el = ev.target;
      if (el.dataset && el.dataset.bind && el.value) logEvent('field', el.dataset.bind + ' = ' + String(el.value).slice(0, 60));
    }, true);

    window.addEventListener('beforeunload', () => { logEvent('session', 'ended'); });

    /* hidden facilitator panel */
    const panel = document.getElementById('panel');
    function togglePanel() { panel.classList.toggle('open'); paintLog(); }
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'L' || e.key === 'l')) { e.preventDefault(); togglePanel(); }
    });
    let clicks = 0, clickT;
    document.addEventListener('click', e => {
      if (!e.target.isConnected || e.target.closest('.phone') || e.target.closest('#panel') || e.target.closest('button')) return;
      clicks++; clearTimeout(clickT);
      clickT = setTimeout(() => { clicks = 0; }, 600);
      if (clicks >= 3) { clicks = 0; togglePanel(); }
    });
    const pidEl = document.getElementById('pid');
    pidEl.addEventListener('input', () => { try { localStorage.setItem('campusbudget.pid', pidEl.value); } catch (e) { } paintLog(); });
    try { pidEl.value = localStorage.getItem('campusbudget.pid') || ''; } catch (e) { }
    document.getElementById('clear').addEventListener('click', () => { LOG = []; persist(); paintLog(); });

    /* export */
    let downloader = null;
    try {
      if (window.claude && typeof window.claude.use === 'function')
        window.claude.use('downloads').then(d => { downloader = d; }).catch(() => { });
    } catch (e) { }

    async function save(filename, text, mime) {
      if (downloader) { try { await downloader.save({ filename: filename, data: text }); return; } catch (e) { } }
      try {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain;charset=utf-8' }));
        a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        return;
      } catch (e) { }
      try { await navigator.clipboard.writeText(text); } catch (e) { }
    }

    const COLS = ['n', 'session', 'participant', 'kind', 'detail', 'extra', 'screen', 'msIntoSession', 'time'];
    const toCsv = () => {
      const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      return [COLS.join(',')].concat(LOG.map(e => COLS.map(c => q(e[c])).join(','))).join('\r\n');
    };
    const stamp = () => new Date().toISOString().slice(0, 10);

    document.getElementById('dl-json').addEventListener('click', () => {
      if (LOG.length) save('usability-log-' + stamp() + '.jsonl', LOG.map(e => JSON.stringify(e)).join('\n'), 'application/jsonl');
    });
    document.getElementById('dl-csv').addEventListener('click', () => {
      if (LOG.length) save('usability-log-' + stamp() + '.csv', '\ufeff' + toCsv(), 'text/csv;charset=utf-8');
    });

    /* scale the phone to fit whatever window it opens in */
    function fit() {
      if (window.innerWidth <= 560) return;
      const k = Math.min((window.innerHeight - 40) / 2694, (window.innerWidth - 40) / 1278);
      document.documentElement.style.setProperty('--k', k);
    }
    window.addEventListener('resize', fit);
    fit();

    logEvent('session', 'started');
  </script>
</body>

</html>
